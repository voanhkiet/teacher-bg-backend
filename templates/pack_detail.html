<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>{{ pack.title_vi }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f7fb;
        }

 .container{
    max-width:1400px;
    margin:auto;
    padding:60px 20px;
}

        .product-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
        }

        .product-image img {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .price {
            font-size: 28px;
            color: #e63946;
            font-weight: bold;
            margin: 20px 0;
        }

        .btn-buy {
            display: inline-block;
            padding: 15px 30px;
            background: #10b981;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
        }

        .description {
            margin-top: 30px;
            line-height: 1.6;
        }

        @media(max-width: 768px) {
            .product-layout {
                grid-template-columns: 1fr;
            }
        }
.product-gallery{
    display:flex;
    gap:20px;
    align-items:flex-start;
}
.main-image img{
    width:650px;
}

.preview-list{
    display:flex;
    gap:12px;
    margin-top:15px;
}



.preview-thumb{
    width:120px;
    height:68px;
    object-fit:cover;
    border-radius:8px;
    cursor:pointer;
    transition:0.2s;
}

.preview-thumb:hover{
    transform:scale(1.05);
}

.preview-thumb.active{
    border:2px solid #22c55e;
}
@media(max-width:900px){

.product-gallery{
    flex-direction:column;
}

.preview-list{
    flex-direction:row;
}

.preview-thumb{
    width:90px;
    height:50px;
}

}
    </style>
</head>
<body>

<div class="container">

<div class="product-layout">

    <!-- LEFT SIDE : GALLERY -->
    <div class="product-gallery">

        <div class="main-image">
            <img id="mainPreview" src="{{ pack.cover_image }}">
        </div>

        {% if pack.preview_images %}
        <div class="preview-list">
            {% for img in pack.preview_images %}
                <img src="{{ img }}" class="preview-thumb">
            {% endfor %}
        </div>
        {% endif %}

    </div>

    <!-- RIGHT SIDE : PRODUCT INFO -->
    <div>

        <h1>{{ pack.title_vi }}</h1>

        <div class="price">
            {{ "{:,}".format(pack.price_vnd) }} VNĐ
        </div>

        {% if owned %}
            <a href="/download/{{ pack.id }}" class="btn-buy">
                Tải Xuống
            </a>
            <p style="color:#16a34a; margin-top:10px;">
                ✔ Bạn đã mua sản phẩm này
            </p>
        {% else %}
            <a href="/buy/{{ pack.id }}" class="btn-buy">
                Mua Ngay
            </a>
        {% endif %}

        <div class="description">
            <h3>Mô Tả Sản Phẩm</h3>
            <p>{{ pack.description_vi }}</p>
        </div>

    </div>

</div>

</div>
<script>

const mainImage = document.getElementById("mainPreview")

document.querySelectorAll(".preview-thumb").forEach(img => {

    img.addEventListener("click", function(){

        mainImage.src = this.src

        document.querySelectorAll(".preview-thumb")
        .forEach(i => i.classList.remove("active"))

        this.classList.add("active")

    })

})

</script>
</body>
</html>
