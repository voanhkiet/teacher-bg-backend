<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hình Nền PowerPoint Cho Giáo Viên</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fb;
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: white;
        }

        .hero h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 60px 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-6px);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
        }

        .price {
            font-size: 20px;
            color: #e63946;
            font-weight: bold;
            margin: 10px 0;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            background: #10b981;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 10px;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="hero">
    <h1>Hình Nền PowerPoint Chuyên Nghiệp Cho Giáo Viên</h1>
    <p>Chọn gói phù hợp và tải ngay sau khi thanh toán</p>
</div>

<div class="container">

    <h2 style="text-align:center; margin-bottom:40px;">
        Các Gói Hiện Có
    </h2>

    <div class="grid">

        {% for pack in packs %}
        <div class="card">

            <img src="/static/{{ pack.cover_image }}" alt="{{ pack.title_vi }}">

            <div class="card-content">
                <h3>{{ pack.title_vi }}</h3>

                <div class="price">
                    {{ "{:,}".format(pack.price_vnd) }} VNĐ
                </div>

                <a href="/pack/{{ pack.id }}" class="btn">
                    Xem Chi Tiết
                </a>
            </div>

        </div>
        {% endfor %}

    </div>

</div>

<footer>
    © 2026 Hình Nền PowerPoint – Thiết kế dành riêng cho giáo viên.
</footer>

</body>
</html>
