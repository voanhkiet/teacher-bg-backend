<!doctype html>
<html>
<head>
  <title>Admin Login</title>
</head>
<body>
  <h2>Admin Login</h2>

  {% if error %}
    <p style="color:red">{{ error }}</p>
  {% endif %}

  <form method="post">
    <div>
      <input name="email" placeholder="Email" required>
    </div>
    <div>
      <input name="password" type="password" placeholder="Password" required>
    </div>
    <button type="submit">Login</button>
  </form>
</body>
</html>
