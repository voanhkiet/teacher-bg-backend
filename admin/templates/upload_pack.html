<h2>Create New Pack</h2>

<form method="POST" enctype="multipart/form-data">

<label>Pack Name</label> <input type="text" name="name" required>

<br><br>

<label>Price</label> <input type="number" name="price" required>

<br><br>

<label>Description</label>

<textarea name="description"></textarea>

<br><br>

<h3>Upload Slides ZIP</h3>

<input type="file" name="slides_zip" accept=".zip" required>

<br><br>

<button type="submit">Create Pack</button>

</form>
